<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f1">
  <meta name="description" content="梁海涛的个人主页，跨境产品开发与运营。">
  <title>梁海涛 · 跨境产品开发与运营</title>
  <link rel="stylesheet" href="styles.css">
  <script src="profile.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="shell header-inner">
      <a class="brand" href="#home" aria-label="回到首页"><span class="brand-mark" aria-hidden="true">✳</span><span data-brand>个人主页</span></a>
      <nav aria-label="主导航">
        <a href="#home" class="active" aria-current="location">首页</a>
        <a href="#projects">项目</a>
        <a href="#about">关于</a>
      </nav>
      <button class="header-action" type="button" data-chat>问问我 <span aria-hidden="true">↗</span></button>
    </div>
  </header>

  <main>
    <section id="home" class="shell hero" aria-labelledby="hero-heading">
      <div class="hero-copy">
        <p class="eyebrow"><span class="short-line"></span><span id="role">个人介绍</span></p>
        <h1 id="hero-heading">你好，我是<br><span data-name>你的名字</span><span class="period" aria-hidden="true">.</span></h1>
        <p class="hero-description" id="intro">欢迎来到我的个人主页。在这里，你可以了解我的经历、浏览我做过的项目，或者从一个问题开始。</p>
        <div class="hero-actions">
          <button class="primary" type="button" data-chat><span aria-hidden="true">✳</span> 和我聊聊</button>
          <a class="text-link" href="#projects">浏览项目 <span aria-hidden="true">↓</span></a>
        </div>
      </div>
      <div class="visual">
        <button class="orb-button" type="button" data-chat aria-label="点击光球，打开个人介绍问答">
          <span class="orbit orbit-outer" aria-hidden="true"></span>
          <span class="orbit orbit-inner" aria-hidden="true"></span>
          <span class="orbit orbit-tilted" aria-hidden="true"></span>
          <span class="orbit-dot" aria-hidden="true"></span>
          <span class="orb" aria-hidden="true"><canvas id="orb-canvas" width="420" height="420"></canvas></span>
        </button>
        <p class="visual-caption"><span aria-hidden="true"></span>点击光球，开启对话</p>
      </div>
    </section>

    <section id="projects" class="shell section" aria-labelledby="projects-heading">
      <div class="section-header">
        <h2 id="projects-heading">精选项目</h2>
        <p id="project-caption">项目展示位置 · 等待补充</p>
      </div>
      <div class="project-grid" id="project-grid"></div>
    </section>

    <section id="about" class="shell section about" aria-labelledby="about-heading">
      <div class="section-header"><h2 id="about-heading">关于我</h2><p id="about-caption">经历与联系方式</p></div>
      <div class="about-grid">
        <article><h3>自我介绍</h3><p id="bio"></p></article>
        <article><h3>经历</h3><div id="experience"></div></article>
      </div>
      <div class="profile-links" id="profile-links" hidden></div>
    </section>
  </main>

  <footer class="shell footer"><span data-brand>个人主页</span><a href="#home">返回顶部 <span aria-hidden="true">↑</span></a></footer>

  <dialog id="chat" class="dialog chat" aria-labelledby="chat-title">
    <div class="dialog-header">
      <div><h2 id="chat-title">问问我</h2><p>根据本站资料回答</p></div>
      <button type="button" class="close" data-close aria-label="关闭问答">×</button>
    </div>
    <div class="chat-log" id="chat-log" role="log" aria-label="对话记录">
      <p class="bubble answer">你好！你可以问我个人介绍、项目、经历或联系方式。</p>
    </div>
    <div class="suggestions" aria-label="推荐问题">
      <button type="button">介绍一下自己</button><button type="button">有哪些项目？</button><button type="button">有哪些经历？</button>
    </div>
    <form id="chat-form"><label class="visually-hidden" for="question">你的问题</label><input id="question" placeholder="输入一个问题…" required maxlength="240" autocomplete="off"><button class="primary" type="submit">发送</button></form>
  </dialog>

  <dialog id="project-dialog" class="dialog project-dialog" aria-labelledby="project-title">
    <div class="dialog-header"><h2 id="project-title"></h2><button type="button" class="close" data-close aria-label="关闭项目详情">×</button></div>
    <div class="project-detail"><p id="project-detail"></p><a id="project-link" class="text-link" target="_blank" rel="noopener noreferrer" hidden>打开项目 ↗</a></div>
  </dialog>
</body>
</html>
